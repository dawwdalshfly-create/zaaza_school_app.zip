name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Unzip and Organize Files
        run: |
          unzip -o zaaza_school_app.zip
          if [ ! -f pubspec.yaml ]; then
            cp -r zaaza_school_app/* . 2>/dev/null || true
            cp -r zaaza_school_app/.* . 2>/dev/null || true
          fi

      - name: Fix App Theme Compatibility
        run: |
          find lib/ -type f -name "*.dart" -exec sed -i 's/CardTheme(/CardThemeData(/g' {} +

      - name: Create Android Folder
        run: flutter create . --platforms=android

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaaza-school-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
